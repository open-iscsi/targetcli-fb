---
# The spec file in this repository is the source for the Fedora package.
# Pull requests are built in Copr and tested in Testing Farm. Releases are
# proposed to Fedora dist-git, together with the spec file and this
# configuration, which also controls the Koji builds and Bodhi updates there.
#
# See documentation: https://packit.dev/docs/configuration

specfile_path: targetcli.spec
upstream_package_name: targetcli
downstream_package_name: targetcli
upstream_tag_template: v{version}

files_to_sync:
  - targetcli.spec
  - .packit.yaml

actions:
  create-archive:
    - hatch build -t sdist
    - bash -c "ls -1t ./dist/*.tar.gz | head -n 1"

srpm_build_deps:
  - hatch
  - python3-hatchling
  - python3-hatch-vcs

jobs:
  - job: copr_build
    trigger: pull_request
    targets:
      - fedora-latest-stable

  - job: tests
    trigger: pull_request
    targets:
      - fedora-latest-stable

  - job: propose_downstream
    trigger: release
    dist_git_branches:
      - fedora-all

  - job: koji_build
    trigger: commit
    dist_git_branches:
      - fedora-all

  - job: bodhi_update
    trigger: commit
    dist_git_branches:
      - fedora-branched
